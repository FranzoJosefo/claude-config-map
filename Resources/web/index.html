<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Claude Config Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="4" y="4" width="18" height="6" rx="2" fill="var(--c-account)"/><rect x="7" y="11" width="18" height="6" rx="2" fill="var(--c-mac)"/><rect x="10" y="18" width="18" height="6" rx="2" fill="var(--c-project)"/></svg>
    <span>Claude Config Map</span>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="map" class="active">Map</button>
    <button role="tab" data-view="stack">What applies here?</button>
  </nav>
  <div class="spacer"></div>
  <input id="search" type="search" placeholder="Filter files…  ⌘F" autocomplete="off">
  <div class="roots-wrap">
    <button id="rootsBtn" class="btn">Scan folders</button>
    <div id="rootsPop" class="pop" hidden></div>
  </div>
  <button id="refreshBtn" class="btn primary" title="Rescan (⌘R)">↻ Refresh</button>
</header>

<main>
  <section id="mapView" class="view">
    <div class="map-toolbar">
      <label><input type="checkbox" id="optEmpty" checked> Show empty projects</label>
      <label><input type="checkbox" id="optOutside"> Show memory outside scan folders</label>
      <span id="mapStatus" class="muted"></span>
    </div>
    <div id="mapScroll" class="map-scroll">
      <div id="map" class="map"></div>
    </div>
  </section>

  <section id="stackView" class="view" hidden>
    <div class="stack-head">
      <div>
        <div class="muted small">A Claude Code session started in</div>
        <div id="stackFolder" class="stack-folder">—</div>
      </div>
      <select id="stackPick"></select>
      <button id="stackChoose" class="btn">Choose folder…</button>
    </div>
    <div id="stackBody" class="stack-body"></div>
  </section>

  <aside id="detail" class="detail"></aside>
</main>

<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
